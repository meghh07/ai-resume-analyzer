<!DOCTYPE html>
<html>
<head>

    <title>AI Resume Analyzer</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI;
        }

        body{
            background:#07111f;
            color:white;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            width:90%;
            max-width:900px;

            background:#101926;

            padding:50px;

            border-radius:20px;

            border:1px solid #2196f3;

            box-shadow:
            0 0 25px rgba(33,150,243,.25);

            text-align:center;
        }

        h1{

            font-size:52px;

            color:#4da3ff;

            margin-bottom:15px;

            text-shadow:
            0 0 15px #2196f3;
        }

        .subtitle{

            color:#b8c7d9;

            margin-bottom:40px;

            font-size:18px;
        }

        .upload-box{

            border:2px dashed #2196f3;

            padding:50px;

            border-radius:15px;

            background:#08111d;
        }

        .upload-box:hover{

            box-shadow:
            0 0 20px rgba(33,150,243,.3);
        }

        input[type=file]{

            margin:20px;
            color:white;
        }

        button{

            padding:15px 40px;

            border:none;

            border-radius:10px;

            background:#2196f3;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:.3s;
        }

        button:hover{

            transform:translateY(-2px);

            background:#42a5f5;

            box-shadow:
            0 0 15px #2196f3;
        }

        .features{

            margin-top:40px;

            display:grid;

            grid-template-columns:
            repeat(3,1fr);

            gap:20px;
        }

        .card{

            background:#08111d;

            padding:20px;

            border-radius:12px;

            border:1px solid #1e88e5;
        }

        .card h3{

            color:#4da3ff;

            margin-bottom:10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🤖 AI Resume Analyzer</h1>

    <p class="subtitle">
        ATS Scanner • Gemini AI Review • Resume Scoring • Career Suggestions
    </p>

    <form action="/upload"
          method="POST"
          enctype="multipart/form-data">

        <div class="upload-box">

            <h2>Upload Resume PDF</h2>

            <br>

            <input
                type="file"
                name="resume"
                accept=".pdf"
                required>

            <br><br>

            <button type="submit">
                Analyze Resume 🚀
            </button>

        </div>

    </form>

    <div class="features">

        <div class="card">
            <h3>ATS Score</h3>
            <p>Measure resume quality instantly.</p>
        </div>

        <div class="card">
            <h3>Gemini AI</h3>
            <p>Recruiter-style feedback powered by AI.</p>
        </div>

        <div class="card">
            <h3>Career Guidance</h3>
            <p>Identify missing skills and improve faster.</p>
        </div>

    </div>

</div>

</body>
</html>
